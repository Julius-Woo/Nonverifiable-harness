[project]
name = "nonverifiable-harness"
version = "0.1.0"
description = "API and CLI seed harness with experiment cost accounting"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.22.0",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]
